  if (devil) drawDevil(devil, t);
  /* the boss goes down first: it is enormous, and anything smaller must
     stay visible in front of it rather than vanishing inside it */
  if (boss) drawBoss(boss, t);
  for (const g of ghosts) drawGhost(g, t);
  for (const w of wolves) drawWolf(w, t);
  for (const v of vamps) drawVamp(v, t);
  for (const f of flasks) drawFlask(f, t);
  for (const vn of venoms) {
    const wobv = Math.sin(vn.ph)*2;
    const zom = vn.kind === 'zombie';
    /* drip trail */
    ctx.fillStyle = zom ? 'rgba(255,210,31,0.35)' : 'rgba(125,219,79,0.35)';
    ctx.beginPath();
    ctx.arc(vn.x - vn.vx*0.05, vn.y - vn.vy*0.05, 5, 0, 6.28);
    ctx.arc(vn.x - vn.vx*0.1,  vn.y - vn.vy*0.1,  3, 0, 6.28);
    ctx.fill();
    /* glowing glob */
    ctx.fillStyle = zom ? '#ffd21f' : '#7ddb4f';
    ctx.beginPath();
    ctx.ellipse(vn.x, vn.y, 9 + wobv*0.5, 11 - wobv*0.5, 0, 0, 6.28);
    ctx.fill();
    ctx.fillStyle = zom ? '#fff3a0' : '#d3f7a6';
    ctx.beginPath();
    ctx.arc(vn.x - 3, vn.y - 3, 3, 0, 6.28);
    ctx.fill();
  }
  for (const b of bats) drawBat(b);

  /* zombie chunks */
  for (const gb of gibs) {
    ctx.save();
    ctx.translate(gb.x, gb.y);
    ctx.rotate(gb.rot);
    ctx.globalAlpha = clamp(gb.life, 0, 1);
    ctx.fillStyle = gb.col;
    ctx.fillRect(-gb.w/2, -gb.h/2, gb.w, gb.h);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(-gb.w/2, gb.h/2 - 2, gb.w, 2);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  /* particles */
  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life*3, 0, 1);
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x-2, p.y-2, 4, 4);
  }
  ctx.globalAlpha = 1;

  /* crosshair marks the last shot */
  if (game.state === 'play' && cross.t < 0.5) {
    const a = 1 - cross.t*2;
    ctx.globalAlpha = a;
    ctx.strokeStyle = '#ff4444';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cross.x, cross.y, 14 + cross.t*20, 0, 6.28);
    ctx.moveTo(cross.x-22, cross.y); ctx.lineTo(cross.x-8, cross.y);
    ctx.moveTo(cross.x+8, cross.y);  ctx.lineTo(cross.x+22, cross.y);
    ctx.moveTo(cross.x, cross.y-22); ctx.lineTo(cross.x, cross.y-8);
    ctx.moveTo(cross.x, cross.y+8);  ctx.lineTo(cross.x, cross.y+22);
    ctx.stroke();
    ctx.lineWidth = 1;
    ctx.globalAlpha = 1;
  }

  if (game.state === 'play' || game.state === 'end') drawGun();

  /* score floats */
  for (const f of floats) {
    ctx.globalAlpha = clamp(f.life, 0, 1);
    text(f.v, f.x, f.y, 13, '#ffe9a0');
  }
  ctx.globalAlpha = 1;

  /* ---------------- HUD (Score / Shells / Bonus, like the FLA) ---------------- */
  if (game.state === 'play') {
    text('Score: ' + game.score, 12, 22, 15, '#ffffff', 'left', TITLE_FONT);
    text('Level ' + game.level, 12, 42, 11, '#b7a6ff', 'left', TITLE_FONT);
    if (mg) {
      const mgCol = Math.floor(t*4)%2 ? '#ffd21f' : '#ffe9a0';
      text('MG: ' + mg.ammo, W-12, 22, 15, mgCol, 'right', TITLE_FONT);
      ctx.fillStyle = 'rgba(255,210,31,0.3)';
      ctx.fillRect(W-92, 34, 80, 5);
      ctx.fillStyle = '#ffd21f';
      ctx.fillRect(W-92 + 80*(1 - mg.t/15), 34, 80*(mg.t/15), 5);
    } else {
      const shellCol = game.shells <= 20 ? (Math.floor(t*3)%2 ? '#ff4444' : '#ff8c1a') : '#ffe9a0';
      text('Shells: ' + game.shells, W-12, 22, 15, shellCol, 'right', TITLE_FONT);
    }
    const lifeCol = game.life > 50 ? '#7cf29a'
                  : game.life > 30 ? '#ffcf6a'
                  : (Math.floor(t*3)%2 ? '#ff4444' : '#ff8c1a');
    text('Life: ' + game.life, W/2, 22, 15, lifeCol, 'center', TITLE_FONT);
    if (game.bonusTimer > 0) {
      ctx.globalAlpha = clamp(game.bonusTimer, 0, 1);
      text(game.bonusText, W/2, 52, 15, '#7cf29a', 'center', TITLE_FONT);
      ctx.globalAlpha = 1;
    }
  }

  /* red flash when a ghoul reaches you */
  if (game.hurtFlash > 0) {
    ctx.fillStyle = 'rgba(200,20,40,' + (game.hurtFlash * 0.8) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  /* the screen shatters when the giant ghoul dies */
  if (shatter) {
    const st = shatter.t;
    if (st < 0.12) {                 /* detonation flash */
      ctx.fillStyle = 'rgba(255,255,255,' + (1 - st/0.12) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    const fade = clamp(1 - (st - 0.1) / 0.9, 0, 1);
    const growth = clamp(st / 0.25, 0, 1);   /* cracks race outward */
    ctx.globalAlpha = fade;
    for (const segs of shatter.cracks) {
      let x = shatter.x, y = shatter.y;
      const n = Math.max(1, Math.floor(segs.length * growth));
      /* bold crack */
      ctx.strokeStyle = 'rgba(240,248,255,0.9)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(x, y);
      for (let i=0;i<n;i++) {
        x += Math.cos(segs[i].a) * segs[i].step;
        y += Math.sin(segs[i].a) * segs[i].step;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
      /* refracted edge */
      ctx.strokeStyle = 'rgba(140,200,255,0.45)';
      ctx.lineWidth = 5;
      ctx.stroke();
    }
    ctx.lineWidth = 1;
    ctx.globalAlpha = 1;
  }

  /* the five best hunts */
  function drawBoard(top, highlight) {
    text('HALL OF HUNTERS', W/2, top, 15, '#b7a6ff', 'center', TITLE_FONT);
    for (let i = 0; i < BOARD_SIZE; i++) {
      const e = board[i];
      const y = top + 34 + i * 26;
      const lit = i === highlight;
      if (lit) {
        ctx.fillStyle = 'rgba(124,242,154,0.14)';
        ctx.fillRect(W*0.08, y - 11, W*0.84, 24);
      }
      const col = !e ? '#4a4460'
                     : lit ? '#7cf29a'
                     : (i === 0 ? '#ffe9a0' : '#d8d2c0');
      text((i + 1) + '.', W*0.12, y, 14, col, 'left', TITLE_FONT);
      text(e ? e.n : '.  .  .  .  .  .', W*0.21, y, 14, col, 'left', TITLE_FONT);
      text(e ? String(e.s) : '--', W*0.90, y, 14, col, 'right', TITLE_FONT);
    }
  }

  if (game.state === 'title') {
    ctx.fillStyle = 'rgba(4,2,12,0.45)';
    ctx.fillRect(0,0,W,H);
    /* title with a wobble, nod to the Ravie original */
    ctx.save();
    ctx.translate(W/2, H*0.22);
    ctx.rotate(Math.sin(t)*0.02);
    text('Ghost', 0, -22, 52, '#e8ecff', 'center', TITLE_FONT);
    text('Hunter', 0, 30, 52, '#b7a6ff', 'center', TITLE_FONT);
    ctx.restore();

    /* the original intro copy */
    text('The ghosts are a menace', W/2, H*0.42, 15, '#d8d2c0', 'center', TITLE_FONT);
    text('at the town cemetery.',   W/2, H*0.455, 15, '#d8d2c0', 'center', TITLE_FONT);
    text('Are you the one to rid the', W/2, H*0.50, 15, '#d8d2c0', 'center', TITLE_FONT);
    text('town of the ghouls?',     W/2, H*0.535, 15, '#d8d2c0', 'center', TITLE_FONT);

    /* START button */
    const bw = 150, bh = 46, bx = W/2-bw/2, by = H*0.60;
    ctx.fillStyle = '#3d1b52';
    ctx.strokeStyle = '#b7a6ff';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 10); ctx.fill(); ctx.stroke();
    ctx.lineWidth = 1;
    text(musicPrimed ? 'START' : '♪ SOUND ON', W/2, by+bh/2, musicPrimed ? 20 : 16, '#ffffff', 'center', TITLE_FONT);

    text('tap the ghouls to shoot', W/2, H*0.72, 12, '#8f88a8', 'center', TITLE_FONT);
    text('ghosts +1 · werewolves +5 · vampires +10', W/2, H*0.755, 11, '#8f88a8', 'center', TITLE_FONT);
    text('flask +25 life · 2 shells per shot · bonus at 150 & 300', W/2, H*0.785, 11, '#8f88a8', 'center', TITLE_FONT);
    text("don't let the ghouls reach your gun!", W/2, H*0.815, 11, '#ff9db0', 'center', TITLE_FONT);
    text('· remake of the 2010 Flash original ·', W/2, H*0.94, 10, '#5c5575', 'center', TITLE_FONT);
  }

  if (game.state === 'nameentry') {
    ctx.fillStyle = 'rgba(4,2,12,0.82)';
    ctx.fillRect(0,0,W,H);
    text('A PLACE AMONG', W/2, H*0.10, 17, '#b7a6ff', 'center', TITLE_FONT);
    text('THE HUNTERS', W/2, H*0.145, 17, '#b7a6ff', 'center', TITLE_FONT);
    text(game.score + ' POINTS', W/2, H*0.21, 22, '#ffe9a0', 'center', TITLE_FONT);
    text('ENTER YOUR NAME', W/2, H*0.27, 12, '#8f88a8', 'center', TITLE_FONT);

    /* the name so far, with a blinking cursor */
    const caret = Math.floor(performance.now()/400) % 2 === 0 ? '_' : ' ';
    ctx.fillStyle = 'rgba(60,40,90,0.55)';
    ctx.fillRect(W*0.12, H*0.30, W*0.76, 34);
    ctx.strokeStyle = '#b7a6ff'; ctx.lineWidth = 2;
    ctx.strokeRect(W*0.12, H*0.30, W*0.76, 34);
    ctx.lineWidth = 1;
    text(entryName + caret, W/2, H*0.30 + 17, 20, '#ffffff', 'center', TITLE_FONT);

    /* the letter grid */
    for (let r = 0; r < KEY_ROWS.length; r++) {
      for (let c = 0; c < KEY_ROWS[r].length; c++) {
        const kx = KEY_X0 + c * KEY_W, ky = KEY_Y0 + r * KEY_H;
        ctx.fillStyle = 'rgba(40,26,64,0.9)';
        ctx.fillRect(kx + 2, ky + 2, KEY_W - 4, KEY_H - 4);
        ctx.strokeStyle = '#4a3d6b';
        ctx.strokeRect(kx + 2.5, ky + 2.5, KEY_W - 5, KEY_H - 5);
        text(KEY_ROWS[r][c], kx + KEY_W/2, ky + KEY_H/2, 19, '#e8e0ff', 'center', TITLE_FONT);
      }
    }
    for (const b of BAR) {
      const ok = b.label === 'OK', no = b.label === 'CANCEL';
      ctx.fillStyle = ok ? 'rgba(60,120,70,0.9)'
                    : no ? 'rgba(96,40,48,0.9)'
                         : 'rgba(40,26,64,0.9)';
      ctx.fillRect(b.x + 2, b.y + 2, b.w - 4, KEY_H - 4);
      ctx.strokeStyle = ok ? '#7cf29a' : no ? '#ff9db0' : '#4a3d6b';
      ctx.strokeRect(b.x + 2.5, b.y + 2.5, b.w - 5, KEY_H - 5);
      text(b.label, b.x + b.w/2, b.y + KEY_H/2, 13,
           ok ? '#dcffe6' : no ? '#ffd8de' : '#c9c2dd', 'center', TITLE_FONT);
    }
    text('Your name among the top ghost hunters!', W/2, BAR_Y2 + KEY_H + 24, 11, '#8f88a8', 'center', TITLE_FONT);
  }

  if (game.state === 'end') {
    ctx.fillStyle = 'rgba(4,2,12,0.62)';
    ctx.fillRect(0,0,W,H);
    text(game.endReason || 'Out of shells!', W/2, H*0.17, 24, '#ff8c8c', 'center', TITLE_FONT);
    text('Final score: ' + game.score, W/2, H*0.245, 19, '#ffffff', 'center', TITLE_FONT);
    drawBoard(H*0.33, lastEntry);
    text(online ? 'shared board · everyone who plays here'
                : boardStored ? 'saved on this device'
                : 'scores kept for this session only',
         W/2, H*0.79, 10, '#5c5575', 'center', TITLE_FONT);
    if (game.endLockT <= 0 && Math.floor(performance.now()/500)%2===0)
      text('TAP TO HUNT AGAIN', W/2, H*0.86, 15, '#ffffff', 'center', TITLE_FONT);
  }
  ctx.restore();
}

/* ---------------- loop ---------------- */
loadBoard();

let last = performance.now();
function loop(now) {
  let dt = (now - last)/1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  update(dt);
  draw(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
