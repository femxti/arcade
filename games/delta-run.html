<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>DELTA RUN</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#000; overflow:hidden; touch-action:none; overscroll-behavior:none; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000; }
  canvas { display:block; image-rendering:pixelated; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
"use strict";
/* ============================================================
   DELTA RUN — a River Raid-style scrolling shooter for mobile
   Drag left/right to steer · drag up/down for throttle
   Hold to auto-fire · fly over fuel barges to refuel
   Shoot the bridge to enter the next sector
   ============================================================ */

const W = 360, H = 640;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function fit() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width  = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
  canvas.width  = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
fit();
addEventListener('resize', fit);

/* ---------------- audio ---------------- */
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function beep(freq, dur, type, vol, slide) {
  if (!AC) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  g.gain.setValueAtTime(vol || 0.08, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  shoot: () => beep(700, 0.07, 'square', 0.04, -450),
  boom:  () => { beep(110, 0.28, 'sawtooth', 0.1, -70); beep(55, 0.35, 'triangle', 0.09, -25); },
  big:   () => { beep(90, 0.5, 'sawtooth', 0.12, -60); beep(45, 0.6, 'triangle', 0.1, -20); },
  fuelLo:() => beep(880, 0.12, 'square', 0.06),
  refuel:() => beep(520, 0.05, 'sine', 0.05, 200),
  crash: () => { beep(300, 0.6, 'sawtooth', 0.12, -260); },
  sector:() => { beep(523,0.1,'square',0.07); setTimeout(()=>beep(659,0.1,'square',0.07),100); setTimeout(()=>beep(784,0.18,'square',0.07),200); }
};

/* ---------------- helpers ---------------- */
const rnd = (a,b) => a + Math.random() * (b - a);
const clamp = (v,a,b) => v < a ? a : (v > b ? b : v);

/* ---------------- pixel sprites ---------------- */
function makeSprite(rows, map) {
  const c = document.createElement('canvas');
  const px = 2;
  c.width = rows[0].length * px; c.height = rows.length * px;
  const g = c.getContext('2d');
  for (let y=0;y<rows.length;y++) for (let x=0;x<rows[y].length;x++) {
    const ch = rows[y][x];
    if (ch !== '.') { g.fillStyle = map[ch]; g.fillRect(x*px, y*px, px, px); }
  }
  return c;
}

const SPR = {};
SPR.jetP = makeSprite([         /* player jet */
  ".....W.....",
  ".....W.....",
  "....WWW....",
  "....WOW....",
  "....WOW....",
  ".W..WOW..W.",
  ".WW.WWW.WW.",
  ".WWWWWWWWW.",
  "WWWWWOWWWWW",
  "WW..WWW..WW",
  "....W.W....",
  "...FF.FF..."
], { W:'#f2f2f2', O:'#ff8c1a', F:'#ffd21f' });

SPR.heli = makeSprite([         /* helicopter */
  "R.RRRRRRR.R",
  "....RRR....",
  ".....G.....",
  "...GGGGG...",
  "..GGGWGGG..",
  ".GGGGGGGGG.",
  "..GGGGGG...",
  "...G..G....",
  "..GG..GG..."
], { R:'#c9d4e0', G:'#4f9e3f', W:'#20242e' });

SPR.ship = makeSprite([         /* patrol ship */
  ".....M.....",
  "....MMM....",
  "..MMMMMMM..",
  ".SSSSSSSSS.",
  "SSSSSSSSSSS",
  ".SSSSSSSSS.",
  "..SSSSSSS.."
], { M:'#c9d4e0', S:'#7a5cff' });

SPR.jetE = makeSprite([         /* enemy jet (crosses fast) */
  "....C......",
  "..CCCCCC...",
  "CCCCCCCCCC.",
  "..CCCCCC...",
  "....C......"
], { C:'#39d5ff' });

SPR.fuel = makeSprite([         /* fuel barge */
  ".YYYYYYYYY.",
  "YYWWWWWWWYY",
  "YYW.....WYY",
  "YYW.FFF.WYY",
  "YYW.F...WYY",
  "YYW.FFF.WYY",
  "YYW...F.WYY",
  "YYW.FFF.WYY",
  "YYW.....WYY",
  "YYWWWWWWWYY",
  ".YYYYYYYYY."
], { Y:'#ff4f6d', W:'#f2f2f2', F:'#ff4f6d' });

SPR.balloon = makeSprite([
  "..OOOOO..",
  ".OOWWOOO.",
  "OOWWOOOOO",
  "OOWOOOOOO",
  ".OOOOOOO.",
  "..OOOOO..",
  "...O.O...",
  "...OOO..."
], { O:'#ffd21f', W:'#fff6d0' });

SPR.heart = makeSprite([
  ".HH.HH.",
  "HHHHHHH",
  "HHHLHHH",
  "HHHHHHH",
  ".HHHHH.",
  "..HHH..",
  "...H..."
], { H:'#ff4f6d', L:'#ffb3c1' });

/* ---------------- input ---------------- */
const input = { touching:false, lastX:0, lastY:0 };
let fireEnabled = true;
/* fire-toggle button (left side, above the dedication) */
const FBTN = { x: 8, y: H - 128, w: 62, h: 46 };
function inBtn(p) {
  return p.x >= FBTN.x - 6 && p.x <= FBTN.x + FBTN.w + 6 &&
         p.y >= FBTN.y - 6 && p.y <= FBTN.y + FBTN.h + 6;
}
function pt(e) {
  const r = canvas.getBoundingClientRect();
  return { x: ((e.clientX - r.left)/r.width)*W, y: ((e.clientY - r.top)/r.height)*H };
}
canvas.addEventListener('pointerdown', e => {
  audio();
  const p = pt(e);
  if (game.state === 'play' && inBtn(p)) {          /* tap toggles firing */
    fireEnabled = !fireEnabled;
    beep(fireEnabled ? 620 : 320, 0.08, 'square', 0.05);
    e.preventDefault();
    return;
  }
  input.touching = true;
  input.lastX = p.x; input.lastY = p.y;
  if (game.state === 'title' || game.state === 'gameover') startRequested = true;
  e.preventDefault();
});
canvas.addEventListener('pointermove', e => {
  if (!input.touching) return;
  const p = pt(e);
  player.targetX += (p.x - input.lastX) * 1.3;
  player.throttle = clamp(player.throttle - (p.y - input.lastY) * 0.006, 0.45, 2.2);
  input.lastX = p.x; input.lastY = p.y;
  e.preventDefault();
});
addEventListener('pointerup',     () => input.touching = false);
addEventListener('pointercancel', () => input.touching = false);

/* ---------------- game state ---------------- */
const game = {
  state: 'title',            /* title | play | crash | gameover */
  score: 0, hi: 15000, lives: 3, sector: 1,
  timer: 0, msg: '', msgTimer: 0, shake: 0, lowFuelT: 0
};
let startRequested = false;

const player = {
  x: W/2, targetX: W/2, y: H - 120,
  throttle: 1, fuel: 100, alive: true, invuln: 0, cooldown: 0
};

let camD = 0;                 /* camera distance along river */
let shots = [], parts = [], floats = [], jets = [];
let jetTimer = 6;

/* ---------------- river terrain ----------------
   The river is generated in strips of SH world units.
   strip index s covers distance [s*SH, (s+1)*SH).       */
const SH = 8;
const SECTOR_LEN = 420;       /* strips per sector (bridge at multiples) */
let strips = {};              /* index -> {l, r, il, ir} island optional */
let objects = [];             /* enemies & fuel on the river */
let bridges = {};             /* sector idx -> {d, hp, alive} */
let genC = W/2, genHW = 95, genMax = 0;

function genStrip(s) {
  if (strips[s]) return strips[s];
  /* deterministic-ish forward generation */
  const inSector = s % SECTOR_LEN;
  const nearBridge = inSector > SECTOR_LEN - 26 || inSector < 14;
  const sectorN = Math.floor(s / SECTOR_LEN) + 1;

  /* wander center & width */
  if (nearBridge) {
    genC += (W/2 - genC) * 0.12;
    genHW += (95 - genHW) * 0.12;
  } else {
    genC += rnd(-4, 4);
    const squeeze = 1 - Math.min(0.35, sectorN * 0.03);
    genHW += rnd(-3.5, 3.5);
    genHW = clamp(genHW, 52 * (2 - squeeze) * 0.5 + 26, 118);
    genC = clamp(genC, genHW + 14, W - genHW - 14);
  }

  let st = { l: genC - genHW, r: genC + genHW, il: 0, ir: 0 };

  /* islands: occasionally split the channel for a while */
  const prev = strips[s-1];
  if (prev && prev.ir > prev.il) {
    /* continue island */
    if (Math.random() < 0.06 || (prev.ir - prev.il) < 10) { st.il = 0; st.ir = 0; }
    else {
      st.il = clamp(prev.il + rnd(-3,3), st.l + 34, st.r - 44);
      st.ir = clamp(st.il + (prev.ir - prev.il) + rnd(-2,2), st.il + 10, st.r - 34);
    }
  } else if (!nearBridge && genHW > 88 && Math.random() < 0.012) {
    st.il = genC - rnd(8, 20);
    st.ir = genC + rnd(8, 20);
  }

  strips[s] = st;

  /* bridge */
  if (inSector === SECTOR_LEN - 1) {
    bridges[Math.floor(s / SECTOR_LEN)] = { d: (s+0.5)*SH, hp: 2, alive: true };
  }

  /* place objects on open water */
  if (!nearBridge && inSector % 3 === 0) {
    const roll = Math.random();
    const water = pickWater(st);
    if (water) {
      const diff = Math.min(1, sectorN * 0.12);
      if (roll < 0.055) objects.push({ type:'fuel', x: water, d: s*SH, alive:true });
      else if (roll < 0.055 + 0.05 + diff*0.04) objects.push({ type:'heli', x: water, d: s*SH, alive:true, vx: rnd(20,45)*(Math.random()<0.5?-1:1) });
      else if (roll < 0.105 + 0.09 + diff*0.05) objects.push({ type:'ship', x: water, d: s*SH, alive:true, vx: rnd(8,18)*(Math.random()<0.5?-1:1) });
      else if (roll < 0.195 + 0.03) objects.push({ type:'balloon', x: water, d: s*SH, alive:true, vx: rnd(-12,12) });
    }
  }
  genMax = Math.max(genMax, s);
  return st;
}

function pickWater(st) {
  if (st.ir > st.il) {
    return Math.random() < 0.5 ? rnd(st.l + 16, st.il - 10) : rnd(st.ir + 10, st.r - 16);
  }
  return rnd(st.l + 16, st.r - 16);
}

function stripAt(d) { return genStrip(Math.floor(d / SH)); }

function resetRiver() {
  strips = {}; objects = []; bridges = {}; jets = [];
  genC = W/2; genHW = 95; genMax = 0;
  camD = 0;
  for (let s = 0; s < 120; s++) genStrip(s);
}

/* distance -> screen y (higher d = farther up the screen) */
function d2y(d) { return H - 40 - (d - camD); }

/* ---------------- combat ---------------- */
function fire() {
  if (shots.length >= 2 || player.cooldown > 0 || !player.alive) return;
  player.cooldown = 0.18;
  sfx.shoot();
  shots.push({ x: player.x, d: camD + (H - 40 - player.y) + 14 });
}

function explode(x, y, col, n) {
  for (let i=0;i<n;i++) {
    const a = rnd(0, 6.28), sp = rnd(30, 150);
    parts.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: rnd(0.3,0.7), col });
  }
}
function addScore(v, x, y) {
  game.score += v;
  if (game.score > game.hi) game.hi = game.score;
  if (x !== undefined) floats.push({ x, y, v: '' + v, life: 0.9 });
}

const SCORES = { ship: 30, heli: 60, fuel: 80, balloon: 60, jet: 100, bridge: 500 };

function crashPlayer(reason) {
  if (!player.alive || player.invuln > 0) return;
  player.alive = false;
  explode(player.x, player.y, '#ff8c1a', 22);
  explode(player.x, player.y, '#f2f2f2', 14);
  sfx.crash();
  game.shake = 6;
  game.state = 'crash';
  game.timer = 2;
  game.msg = reason; game.msgTimer = 1.6;
}

/* ---------------- update ---------------- */
function update(dt) {
  if (game.shake > 0) game.shake = Math.max(0, game.shake - dt * 14);
  if (game.msgTimer > 0) game.msgTimer -= dt;

  if (game.state === 'title' || game.state === 'gameover') {
    if (startRequested) {
      startRequested = false;
      game.score = 0; game.lives = 3; game.sector = 1;
      fireEnabled = true;
      player.fuel = 100; player.throttle = 1; player.alive = true;
      player.x = player.targetX = W/2; player.invuln = 2;
      resetRiver();
      game.state = 'play';
      game.msg = 'SECTOR 1'; game.msgTimer = 2; sfx.sector();
    }
    return;
  }

  if (game.state === 'crash') {
    game.timer -= dt;
    if (game.timer <= 0) {
      if (game.lives > 0) {
        game.lives--;
        /* respawn at current position, river centered ahead */
        player.alive = true; player.fuel = 100; player.throttle = 1; player.invuln = 2.5;
        const st = stripAt(camD + (H - 40 - player.y));
        const cx = st.ir > st.il ? (st.l + st.il)/2 : (st.l + st.r)/2;
        player.x = player.targetX = cx;
        game.state = 'play';
      } else {
        game.state = 'gameover';
      }
    }
    /* keep particles simulating */
  }

  if (game.state === 'play') {
    /* movement & scroll */
    const speed = 95 * player.throttle;
    camD += speed * dt;
    genStrip(Math.floor((camD + H + 200) / SH));   /* keep terrain generated ahead */

    player.targetX = clamp(player.targetX, 10, W - 10);
    player.x += (player.targetX - player.x) * Math.min(1, dt * 16);
    player.cooldown -= dt;
    if (player.invuln > 0) player.invuln -= dt;
    if (input.touching && fireEnabled) fire();

    /* fuel */
    player.fuel -= dt * (2.1 + player.throttle * 1.5);
    if (player.fuel < 25) {
      game.lowFuelT -= dt;
      if (game.lowFuelT <= 0) { sfx.fuelLo(); game.lowFuelT = 0.6; }
    }
    if (player.fuel <= 0) { player.fuel = 0; crashPlayer('OUT OF FUEL'); }

    /* terrain collision at the player's nose & wings */
    const pd = camD + (H - 40 - player.y);
    const st = stripAt(pd);
    const wing = 9;
    if (player.x - wing < st.l || player.x + wing > st.r ||
        (st.ir > st.il && player.x + wing > st.il && player.x - wing < st.ir)) {
      crashPlayer('CRASHED');
    }

    /* bridge collision + sector advance */
    for (const k in bridges) {
      const b = bridges[k];
      if (!b.alive) continue;
      if (Math.abs(b.d - pd) < 10) crashPlayer('HIT THE BRIDGE');
    }
    const curSector = Math.floor(pd / (SECTOR_LEN * SH)) + 1;
    if (curSector > game.sector) {
      game.sector = curSector;
      addScore(0);
      game.msg = 'SECTOR ' + game.sector; game.msgTimer = 2; sfx.sector();
    }

    /* enemy jets crossing the screen */
    jetTimer -= dt;
    if (jetTimer <= 0) {
      const dir = Math.random() < 0.5 ? 1 : -1;
      jets.push({ x: dir < 0 ? W + 20 : -20, y: rnd(120, 320), vx: dir * rnd(150, 230) * (1 + game.sector*0.06), alive: true });
      jetTimer = Math.max(2.2, rnd(4, 8) - game.sector * 0.3);
    }
    for (let i = jets.length - 1; i >= 0; i--) {
      const j = jets[i];
      j.x += j.vx * dt;
      if (j.x < -40 || j.x > W + 40) { jets.splice(i,1); continue; }
      if (player.alive && player.invuln <= 0 &&
          Math.abs(j.x - player.x) < 14 && Math.abs(j.y - player.y) < 10) {
        j.alive = false; jets.splice(i,1);
        explode(j.x, j.y, '#39d5ff', 12);
        crashPlayer('MIDAIR COLLISION');
      }
    }

    /* river objects */
    for (const o of objects) {
      if (!o.alive) continue;
      const y = d2y(o.d);
      if (y < -60 || y > H + 60) continue;
      const stO = stripAt(o.d);
      if (o.type === 'heli' || o.type === 'ship' || o.type === 'balloon') {
        o.x += o.vx * dt;
        const lo = (stO.ir > stO.il && o.x < stO.il) ? stO.l + 12 : (stO.ir > stO.il && o.x > stO.il ? stO.ir + 8 : stO.l + 12);
        const hi = (stO.ir > stO.il && o.x < stO.ir && o.x < stO.il) ? stO.il - 8 : stO.r - 12;
        if (o.x < lo) { o.x = lo; o.vx = Math.abs(o.vx); }
        if (o.x > hi) { o.x = hi; o.vx = -Math.abs(o.vx); }
      }
      /* fuel pickup: fly over the barge */
      if (o.type === 'fuel' && player.alive &&
          Math.abs(o.x - player.x) < 16 && Math.abs(y - player.y) < 18) {
        player.fuel = Math.min(100, player.fuel + dt * 34);
        if (Math.random() < dt * 12) sfx.refuel();
      }
      /* collision with player */
      if (o.type !== 'fuel' && player.alive && player.invuln <= 0 &&
          Math.abs(o.x - player.x) < 13 && Math.abs(y - player.y) < 11) {
        o.alive = false;
        explode(o.x, y, '#ff4f6d', 12);
        crashPlayer('CRASHED');
      }
    }

    /* prune old objects */
    objects = objects.filter(o => o.alive && o.d > camD - 100);
  }

  /* shots */
  for (let i = shots.length - 1; i >= 0; i--) {
    const s = shots[i];
    s.d += 620 * dt;
    const y = d2y(s.d);
    if (y < -20) { shots.splice(i,1); continue; }
    let hit = false;

    /* bank hit stops the shot */
    const stS = stripAt(s.d);
    if (s.x < stS.l || s.x > stS.r || (stS.ir > stS.il && s.x > stS.il && s.x < stS.ir)) {
      shots.splice(i,1); continue;
    }
    /* bridges */
    for (const k in bridges) {
      const b = bridges[k];
      if (b.alive && Math.abs(b.d - s.d) < 10) {
        b.hp--;
        if (b.hp <= 0) {
          b.alive = false;
          addScore(SCORES.bridge, W/2, d2y(b.d));
          explode(W/2 - 40, d2y(b.d), '#ff8c1a', 14);
          explode(W/2 + 40, d2y(b.d), '#ff8c1a', 14);
          explode(W/2, d2y(b.d), '#c9d4e0', 16);
          sfx.big(); game.shake = 5;
        } else { sfx.boom(); explode(s.x, y, '#c9d4e0', 8); }
        hit = true; break;
      }
    }
    /* objects */
    if (!hit) for (const o of objects) {
      if (!o.alive) continue;
      if (Math.abs(o.x - s.x) < 13 && Math.abs(o.d - s.d) < 11) {
        o.alive = false;
        addScore(SCORES[o.type], o.x, d2y(o.d));
        explode(o.x, d2y(o.d), o.type === 'fuel' ? '#ffd21f' : '#ff4f6d', 14);
        sfx.boom();
        hit = true; break;
      }
    }
    /* jets */
    if (!hit) for (let j = jets.length - 1; j >= 0; j--) {
      const jt = jets[j];
      if (Math.abs(jt.x - s.x) < 13 && Math.abs(jt.y - y) < 9) {
        jets.splice(j,1);
        addScore(SCORES.jet, jt.x, jt.y);
        explode(jt.x, jt.y, '#39d5ff', 14);
        sfx.boom();
        hit = true; break;
      }
    }
    if (hit) shots.splice(i,1);
  }

  /* particles / floats */
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= (1 - dt*2); p.vy *= (1 - dt*2);
    p.life -= dt;
    if (p.life <= 0) parts.splice(i,1);
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    floats[i].y -= 24 * dt; floats[i].life -= dt;
    if (floats[i].life <= 0) floats.splice(i,1);
  }
}

/* ---------------- draw ---------------- */
function drawSprite(img, x, y, rot, scale) {
  ctx.save();
  ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  const s = scale || 1;
  ctx.drawImage(img, -img.width*s/2, -img.height*s/2, img.width*s, img.height*s);
  ctx.restore();
}
function text(str, x, y, size, col, align) {
  ctx.font = '700 ' + size + 'px "Courier New", monospace';
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#000';
  ctx.fillText(str, x+1.5, y+1.5);
  ctx.fillStyle = col;
  ctx.fillText(str, x, y);
}

function draw(dt) {
  ctx.save();
  if (game.shake > 0) ctx.translate(rnd(-game.shake, game.shake), rnd(-game.shake, game.shake));

  /* terrain, strip by strip */
  const s0 = Math.floor(camD / SH) - 2;
  const s1 = Math.floor((camD + H) / SH) + 2;
  for (let s = s0; s <= s1; s++) {
    const st = genStrip(Math.max(0, s));
    const y = d2y((s+1) * SH);
    const h = SH + 1;
    /* land */
    const landA = '#3f7a2e', landB = '#356827';
    ctx.fillStyle = (s % 2 === 0) ? landA : landB;
    ctx.fillRect(0, y, st.l, h);
    ctx.fillRect(st.r, y, W - st.r, h);
    /* shore */
    ctx.fillStyle = '#d9c977';
    ctx.fillRect(st.l - 3, y, 3, h);
    ctx.fillRect(st.r, y, 3, h);
    /* water */
    ctx.fillStyle = (s % 2 === 0) ? '#1b4fd8' : '#1a48c4';
    ctx.fillRect(st.l, y, st.r - st.l, h);
    /* island */
    if (st.ir > st.il) {
      ctx.fillStyle = '#d9c977';
      ctx.fillRect(st.il - 3, y, (st.ir - st.il) + 6, h);
      ctx.fillStyle = (s % 2 === 0) ? landA : landB;
      ctx.fillRect(st.il, y, st.ir - st.il, h);
    }
    /* sparse water glints */
    if ((s * 7) % 13 === 0) {
      ctx.fillStyle = 'rgba(160,200,255,0.5)';
      ctx.fillRect(st.l + ((s*37) % Math.max(20, (st.r - st.l - 20))) + 8, y + 3, 6, 1);
    }
  }

  /* bridges */
  for (const k in bridges) {
    const b = bridges[k];
    const y = d2y(b.d);
    if (y < -30 || y > H + 30) continue;
    if (b.alive) {
      ctx.fillStyle = '#8a8f99';
      ctx.fillRect(0, y - 9, W, 18);
      ctx.fillStyle = '#63676f';
      for (let x = 6; x < W; x += 24) ctx.fillRect(x, y - 9, 10, 18);
      ctx.fillStyle = '#ffd21f';
      for (let x = 2; x < W; x += 16) ctx.fillRect(x, y - 1, 8, 2);
      if (b.hp === 1) {                       /* damaged look */
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.fillRect(W*0.35, y - 9, W*0.3, 18);
      }
    } else {
      ctx.fillStyle = '#63676f';               /* broken stubs */
      ctx.fillRect(0, y - 9, 60, 18);
      ctx.fillRect(W - 60, y - 9, 60, 18);
    }
  }

  /* objects */
  for (const o of objects) {
    if (!o.alive) continue;
    const y = d2y(o.d);
    if (y < -30 || y > H + 30) continue;
    if (o.type === 'fuel') drawSprite(SPR.fuel, o.x, y, 0, 1);
    if (o.type === 'ship') drawSprite(SPR.ship, o.x, y, 0, 1);
    if (o.type === 'heli') {
      drawSprite(SPR.heli, o.x, y, 0, 1);
      /* rotor blur */
      ctx.globalAlpha = 0.5 + 0.5*Math.sin(performance.now()/30);
      ctx.fillStyle = '#e8f0ff';
      ctx.fillRect(o.x - 12, y - 9, 24, 2);
      ctx.globalAlpha = 1;
    }
    if (o.type === 'balloon') drawSprite(SPR.balloon, o.x, y + Math.sin(performance.now()/300 + o.d)*3, 0, 1);
  }

  /* jets */
  for (const j of jets) {
    ctx.save();
    ctx.translate(j.x, j.y);
    if (j.vx < 0) ctx.scale(-1, 1);
    ctx.drawImage(SPR.jetE, -SPR.jetE.width/2, -SPR.jetE.height/2);
    ctx.restore();
  }

  /* shots */
  ctx.fillStyle = '#fff6d0';
  for (const s of shots) ctx.fillRect(s.x - 1.5, d2y(s.d) - 6, 3, 10);

  /* player */
  if (player.alive) {
    const blink = player.invuln > 0 && Math.floor(player.invuln * 12) % 2 === 0;
    if (!blink) {
      drawSprite(SPR.jetP, player.x, player.y, 0, 1);
      /* thrust flame scales with throttle */
      const fl = 4 + player.throttle * 5 + rnd(0,3);
      ctx.fillStyle = '#ff8c1a';
      ctx.fillRect(player.x - 2, player.y + 12, 4, fl);
      ctx.fillStyle = '#ffd21f';
      ctx.fillRect(player.x - 1, player.y + 12, 2, fl * 0.6);
    }
  }

  /* particles */
  for (const p of parts) {
    ctx.globalAlpha = clamp(p.life * 2, 0, 1);
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
  }
  ctx.globalAlpha = 1;
  for (const f of floats) {
    ctx.globalAlpha = clamp(f.life, 0, 1);
    text(f.v, f.x, f.y, 11, '#fff6d0');
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  /* ---------------- HUD panel ---------------- */
  ctx.fillStyle = '#10131c';
  ctx.fillRect(0, H - 40, W, 40);
  ctx.fillStyle = '#20242e';
  ctx.fillRect(0, H - 40, W, 2);

  /* fuel gauge */
  const fx = 14, fw = 150;
  text('F', fx - 6, H - 20, 12, '#ffd21f', 'left');
  ctx.fillStyle = '#20242e';
  ctx.fillRect(fx + 8, H - 28, fw, 16);
  const low = player.fuel < 25;
  const flash = low && Math.floor(performance.now()/250) % 2 === 0;
  ctx.fillStyle = low ? (flash ? '#ff2244' : '#ff8c1a') : '#4f9e3f';
  ctx.fillRect(fx + 8, H - 28, fw * (player.fuel/100), 16);
  ctx.strokeStyle = '#63676f';
  ctx.strokeRect(fx + 8.5, H - 27.5, fw, 15);
  for (let i=1;i<4;i++) { ctx.fillStyle = '#10131c'; ctx.fillRect(fx + 8 + fw*i/4, H - 28, 1, 16); }
  text('E', fx + 8 + 6, H - 20, 9, '#c9d4e0');
  text('F', fx + 8 + fw - 6, H - 20, 9, '#c9d4e0');

  /* throttle */
  const tx = fx + fw + 30;
  text('SPD', tx, H - 31, 8, '#39d5ff');
  ctx.fillStyle = '#20242e'; ctx.fillRect(tx - 12, H - 26, 24, 12);
  ctx.fillStyle = '#39d5ff';
  ctx.fillRect(tx - 12, H - 26, 24 * ((player.throttle - 0.45)/(2.2 - 0.45)), 12);

  /* lives */
  for (let i=0;i<game.lives;i++) drawSprite(SPR.jetP, W - 20 - i*20, H - 20, 0, 0.65);

  /* top HUD */
  text(('' + game.score).padStart(6,'0'), 14, 20, 14, '#ffffff', 'left');
  text('HI ' + ('' + game.hi).padStart(6,'0'), W - 14, 20, 11, '#c9d4e0', 'right');
  text('SECTOR ' + game.sector, W/2, 20, 11, '#39d5ff');

  /* fire-toggle button (left side) */
  if (game.state === 'play' || game.state === 'crash') {
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = fireEnabled ? 'rgba(79,158,63,0.85)' : 'rgba(255,140,26,0.9)';
    ctx.strokeStyle = '#e8f0ff';
    ctx.beginPath();
    ctx.roundRect(FBTN.x, FBTN.y, FBTN.w, FBTN.h, 8);
    ctx.fill(); ctx.stroke();
    /* bullet icon */
    ctx.fillStyle = '#fff6d0';
    ctx.fillRect(FBTN.x + FBTN.w/2 - 2, FBTN.y + 7, 4, 12);
    if (!fireEnabled) {                       /* slash through it */
      ctx.strokeStyle = '#ff2244';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(FBTN.x + FBTN.w/2 - 9, FBTN.y + 4);
      ctx.lineTo(FBTN.x + FBTN.w/2 + 9, FBTN.y + 21);
      ctx.stroke();
      ctx.lineWidth = 1;
    }
    text(fireEnabled ? 'FIRING' : 'HOLD', FBTN.x + FBTN.w/2, FBTN.y + FBTN.h - 11, 9, '#ffffff');
    ctx.globalAlpha = 1;
    if (!fireEnabled && Math.floor(performance.now()/400) % 2 === 0)
      text('guns holding — safe to refuel', FBTN.x, FBTN.y - 12, 9, '#ffd21f', 'left');
  }

  /* lower-left dedication */
  const pulse = 1 + 0.12 * Math.sin(performance.now() / 300);
  drawSprite(SPR.heart, 14, H - 52, 0, pulse);
  text('I Love You', 26, H - 52, 10, '#ffb3c1', 'left');

  if (game.msgTimer > 0 && game.msg) {
    ctx.globalAlpha = clamp(game.msgTimer, 0, 1);
    text(game.msg, W/2, H*0.4, 20, '#ffd21f');
    ctx.globalAlpha = 1;
  }

  if (game.state === 'title') {
    ctx.fillStyle = 'rgba(0,0,10,0.55)';
    ctx.fillRect(0, 0, W, H);
    text('D E L T A', W/2, H*0.26, 40, '#ffd21f');
    text('R U N', W/2, H*0.33, 30, '#39d5ff');
    drawSprite(SPR.heli, W/2 - 70, H*0.45, 0, 1.2);  text('CHOPPER  60', W/2 - 30, H*0.45, 11, '#4f9e3f', 'left');
    drawSprite(SPR.ship, W/2 - 70, H*0.51, 0, 1.2);  text('GUNBOAT  30', W/2 - 30, H*0.51, 11, '#7a5cff', 'left');
    drawSprite(SPR.jetE, W/2 - 70, H*0.57, 0, 1.2);  text('JET     100', W/2 - 30, H*0.57, 11, '#39d5ff', 'left');
    drawSprite(SPR.fuel, W/2 - 70, H*0.63, 0, 1.1);  text('FUEL BARGE — fly over to refuel', W/2 - 30, H*0.63, 10, '#ff4f6d', 'left');
    if (Math.floor(performance.now()/500) % 2 === 0)
      text('TAP TO START', W/2, H*0.75, 16, '#ffffff');
    text('drag ⟷ steer · drag ↕ throttle · hold to fire', W/2, H*0.81, 10, '#c9d4e0');
    text('left button pauses your guns for refueling', W/2, H*0.835, 10, '#ff8c1a');
    text('shoot the bridge to enter the next sector', W/2, H*0.86, 10, '#ffd21f');
  }

  if (game.state === 'gameover') {
    ctx.fillStyle = 'rgba(0,0,10,0.55)';
    ctx.fillRect(0, 0, W, H);
    text('GAME OVER', W/2, H*0.4, 28, '#ff2244');
    text('SCORE  ' + game.score, W/2, H*0.48, 16, '#ffffff');
    text('SECTOR ' + game.sector, W/2, H*0.53, 12, '#39d5ff');
    if (game.score >= game.hi) text('NEW HIGH SCORE!', W/2, H*0.58, 13, '#ffd21f');
    if (Math.floor(performance.now()/500) % 2 === 0)
      text('TAP TO FLY AGAIN', W/2, H*0.67, 14, '#ffffff');
  }
}

/* ---------------- loop ---------------- */
resetRiver();
let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  update(dt);
  draw(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
